[project]
name = "orgwarrior-web"
version = "0.1.0"
description = "The org agenda on a phone: a small web page over orgwarrior's engine"
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["orgwarrior @ git+https://github.com/aleksozolins/orgwarrior"]

[project.urls]
Homepage = "https://github.com/aleksozolins/orgwarrior-web"

[project.scripts]
orgwarrior-web = "orgwarrior_web.server:main"

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: license as SPDX (PEP 639)
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]

# orgwarrior from GitHub for an install from GitHub (uv tool install
# --no-sources); from the checkout beside this one for development (uv run,
# uv tool install --editable), so the tests use its fixtures and its code.
[tool.uv.sources]
orgwarrior = { path = "../orgwarrior", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
