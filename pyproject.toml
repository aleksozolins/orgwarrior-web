[project]
name = "orgwarrior-web"
version = "0.3.1"
description = "The org agenda on a phone: a small web page over orgwarrior's engine"
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Aleks Ozolins", email = "aleks@ozolins.xyz" }]
keywords = ["org-mode", "emacs", "agenda", "gtd", "tasks", "pwa"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Text Editors :: Emacs",
]
dependencies = ["orgwarrior>=0.3.1"]

[project.urls]
Homepage = "https://github.com/aleksozolins/orgwarrior-web"
Issues = "https://github.com/aleksozolins/orgwarrior-web/issues"

[project.scripts]
orgwarrior-web = "orgwarrior_web.server:main"
# Its dependency's command too: one install gives both, one copy of the engine.
orgwarrior = "orgwarrior.cli:main"

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: license as SPDX (PEP 639)
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]

# orgwarrior from the checkout beside this one for development (uv run, uv
# tool install --editable), so the tests use its fixtures and its code; a
# published package carries none of this.
[tool.uv.sources]
orgwarrior = { path = "../orgwarrior", editable = true }

# CLAUDE.md is notes for working on the code, CLAUDE.local.md the maintainer's own.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "CLAUDE.local.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
